<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kakao Map</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }
    </style>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d172d22c60e3873dff49ddbd4c0526fb&autoload=false"></script>
</head>
<body>
<div id="map"></div>

<script>
    let map;

    function initMap(lat, lng) {
      kakao.maps.load(() => {
        const container = document.getElementById('map');
        const options = {
          center: new kakao.maps.LatLng(lat, lng),
          level: 3
        };
        map = new kakao.maps.Map(container, options);

        new kakao.maps.Marker({
          map: map,
          position: new kakao.maps.LatLng(lat, lng),
        });

        console.log("지도 표시 완료:", lat, lng);
      });
    }

    function addStoreMarkers(storesJson) {
      let stores;

      try {
        stores = JSON.parse(storesJson);
      } catch (e) {
        console.error("JSON 파싱 실패:", e);
        return;
      }

      if (!map || !Array.isArray(stores)) {
        console.warn("마커 추가 실패");
        return;
      }

      stores.forEach(store => {
        const marker = new kakao.maps.Marker({
          map: map,
          position: new kakao.maps.LatLng(store.latitude, store.longitude)
        });

        const infoWindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:5px; font-size:14px;">${store.name}</div>`
        });

        kakao.maps.event.addListener(marker, 'click', () => {
          infoWindow.open(map, marker);
        });
      });

      console.log("addStoreMarkers 실행됨:", stores.length);
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap(36.386341, 127.3154637);
      console.log("DOMContentLoaded");
    });
</script>

</body>
</html>
